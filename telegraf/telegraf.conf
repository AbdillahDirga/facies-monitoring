[agent]
  interval = "1s"
  flush_interval = "1s"

# --- INPUT: consume from the Kafka topic the bridge writes to ---
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["facies-welllog"]
  consumer_group = "telegraf-facies"

  # "oldest" replays everything already sitting in the topic (useful while
  # testing/developing). Switch to "newest" later if you only want data
  # produced after Telegraf starts.
  offset = "oldest"

  data_format = "json"
  name_override = "welllog"

  # These become InfluxDB tags (indexed, good for filtering in Grafana).
  # Keys must match the JSON field names exactly, including the space.
  tag_keys = ["Well Name", "Formation"]

# --- OUTPUT: write to InfluxDB v2 ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUXDB_TOKEN"
  organization = "$INFLUXDB_ORG"
  bucket = "$INFLUXDB_BUCKET"